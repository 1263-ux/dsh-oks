name: dsh-oks compatibility

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - run: node --check lib/index.mjs
      - run: node --check lib/client.js
      - run: npm run verify:pack

  dsh-rc8-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: npm install --no-save --ignore-scripts --legacy-peer-deps @deepseek-ai/dsh@0.1.0-rc.8 dsh-better-sidebar@0.15.2
      - run: npm ls @deepseek-ai/dsh dsh-better-sidebar @deepseek-ai/cordis --depth=0
      - run: npm test
      - run: npm run build
      - run: npm run verify:pack
